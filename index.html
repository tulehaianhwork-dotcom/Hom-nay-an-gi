<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hôm Nay Ăn Gì? - Nhóm Foodie</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thư viện MQTT để đồng bộ Real-time siêu tốc -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #f3f4f6; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-800 pb-20">

    <!-- Header & Room Info -->
    <div class="bg-white shadow-sm p-4 sticky top-0 z-10">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-orange-600">🍕 Hôm Nay Ăn Gì?</h1>
            <div id="sync-status" class="text-xs font-bold text-yellow-500 bg-yellow-100 px-2 py-1 rounded-full animate-pulse">
                ⏳ Đang kết nối...
            </div>
        </div>
        <div class="max-w-md mx-auto mt-3 flex gap-2">
            <button onclick="copyRoomLink()" class="flex-1 bg-blue-100 text-blue-600 py-2 rounded-lg font-bold text-sm shadow-sm active:scale-95 transition">
                🔗 Copy Link Phòng Chung
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Randomizer -->
        <div class="bg-gradient-to-r from-orange-400 to-red-500 p-5 rounded-2xl shadow-lg text-center text-white">
            <h2 class="text-lg font-bold mb-3">Bạn không biết ăn gì?</h2>
            <div id="random-result" class="text-2xl font-bold mb-4 min-h-[40px] flex items-center justify-center break-words">
                Bấm nút để random!
            </div>
            <button onclick="spinRandom()" class="bg-white text-orange-600 px-6 py-3 rounded-full font-bold shadow-md w-full active:scale-95 transition text-lg">
                🎲 Chọn Ngẫu Nhiên
            </button>
        </div>

        <!-- Filter -->
        <div class="flex gap-2 overflow-x-auto hide-scroll py-1">
            <select id="filter-price" onchange="renderList()" class="bg-white border p-2 rounded-lg text-sm font-bold shadow-sm outline-none">
                <option value="all">Mọi mức giá</option>
                <option value="<100k">&lt;100k</option>
                <option value="100-250k">100-250k</option>
                <option value=">250k">&gt;250k</option>
            </select>
        </div>

        <!-- List -->
        <div id="places-list" class="space-y-3">
            <!-- Items render here -->
        </div>
    </div>

    <!-- Floating Add Button -->
    <button onclick="toggleModal(true)" class="fixed bottom-6 right-6 bg-orange-500 text-white w-14 h-14 rounded-full shadow-lg text-3xl flex items-center justify-center active:scale-95 transition z-20">
        +
    </button>

    <!-- Add Modal -->
    <div id="add-modal" class="fixed inset-0 bg-black/60 z-30 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm flex flex-col max-h-[90vh]">
            <div class="p-4 border-b font-bold text-lg flex justify-between items-center">
                <h3>Thêm Quán Mới</h3>
                <button onclick="toggleModal(false)" class="text-gray-400 text-2xl">&times;</button>
            </div>
            
            <div class="p-4 overflow-y-auto space-y-4">
                <div>
                    <label class="block text-sm font-bold mb-1">Chọn Icon Món:</label>
                    <div class="flex flex-wrap gap-2 text-2xl" id="emoji-picker">
                        <span class="cursor-pointer p-2 bg-gray-100 rounded-lg border-2 border-transparent" onclick="selectEmoji(this, '🍜')">🍜</span>
                        <span class="cursor-pointer p-2 bg-gray-100 rounded-lg border-2 border-transparent" onclick="selectEmoji(this, '🍚')">🍚</span>
                        <span class="cursor-pointer p-2 bg-gray-100 rounded-lg border-2 border-transparent" onclick="selectEmoji(this, '☕')">☕</span>
                        <span class="cursor-pointer p-2 bg-gray-100 rounded-lg border-2 border-transparent" onclick="selectEmoji(this, '🧋')">🧋</span>
                        <span class="cursor-pointer p-2 bg-gray-100 rounded-lg border-2 border-transparent" onclick="selectEmoji(this, '🥩')">🥩</span>
                        <span class="cursor-pointer p-2 bg-gray-100 rounded-lg border-2 border-transparent" onclick="selectEmoji(this, '🍔')">🍔</span>
                    </div>
                </div>
                
                <input type="text" id="input-name" placeholder="Tên quán (VD: Bún chả Đắc Kim)" class="w-full border p-3 rounded-lg outline-none text-sm focus:border-orange-500">
                <input type="text" id="input-district" placeholder="Khu vực / Quận" class="w-full border p-3 rounded-lg outline-none text-sm focus:border-orange-500">
                
                <select id="input-price" class="w-full border p-3 rounded-lg outline-none text-sm focus:border-orange-500">
                    <option value="<100k">&lt;100k (Rẻ)</option>
                    <option value="100-250k">100 - 250k (Vừa)</option>
                    <option value=">250k">&gt;250k (Cao cấp)</option>
                </select>
                
                <input type="text" id="input-map" placeholder="Link Google Maps (Bắt buộc)" class="w-full border p-3 rounded-lg outline-none text-sm focus:border-orange-500">
            </div>
            
            <div class="p-4 border-t">
                <button onclick="savePlace()" class="w-full bg-orange-500 text-white font-bold py-3 rounded-xl shadow-md active:scale-95 transition">
                    Lưu Quán & Chia sẻ lên mây
                </button>
            </div>
        </div>
    </div>

    <script>
        let places = [];
        let selectedEmoji = '🍜';
        
        // --- REAL-TIME MQTT SYNC SETUP ---
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'team-foodie-' + Math.floor(Math.random()*10000);
        if(!urlParams.get('room')) {
            window.history.replaceState({}, '', `?room=${roomId}`);
        }
        
        const brokerUrl = "broker.emqx.io";
        const brokerPort = 8084; // WSS Port - Bắt buộc dùng cho GitHub Pages (HTTPS)
        const topic = `vn/homnayangi/room/${roomId}`;
        const clientId = "client_" + Math.random().toString(16).substr(2, 8);
        
        const client = new Paho.Client(brokerUrl, brokerPort, clientId);
        
        client.onMessageArrived = (message) => {
            try {
                const data = JSON.parse(message.payloadString);
                if (Array.isArray(data)) {
                    places = data; // Luôn lấy bản mới nhất trên mây đè xuống
                    renderList();
                }
            } catch(e) { console.error(e); }
        };

        client.onConnectionLost = (responseObject) => {
            if (responseObject.errorCode !== 0) {
                document.getElementById('sync-status').className = "text-xs font-bold text-red-500 bg-red-100 px-2 py-1 rounded-full";
                document.getElementById('sync-status').innerHTML = "🔴 Mất kết nối";
                setTimeout(connectMQTT, 3000); // Thử kết nối lại
            }
        };

        function connectMQTT() {
            client.connect({
                useSSL: true,
                onSuccess: () => {
                    client.subscribe(topic);
                    document.getElementById('sync-status').className = "text-xs font-bold text-green-700 bg-green-100 px-2 py-1 rounded-full";
                    document.getElementById('sync-status').innerHTML = "🟢 Real-time ON";
                },
                onFailure: (e) => {
                    console.log("Connect failed, retrying...");
                    setTimeout(connectMQTT, 3000);
                }
            });
        }
        connectMQTT(); // Bắt đầu kết nối

        // Hàm Đẩy dữ liệu lên mây
        function publishData() {
            const message = new Paho.Message(JSON.stringify(places));
            message.destinationName = topic;
            message.retained = true; // Lưu giữ tin nhắn cho người vào sau
            client.send(message);
        }

        // --- GIAO DIỆN & LOGIC ---

        function selectEmoji(element, emoji) {
            selectedEmoji = emoji;
            const items = document.querySelectorAll('#emoji-picker span');
            items.forEach(el => el.classList.replace('border-orange-500', 'border-transparent'));
            element.classList.replace('border-transparent', 'border-orange-500');
        }

        function toggleModal(show) {
            document.getElementById('add-modal').style.display = show ? 'flex' : 'none';
        }

        function getPriceColor(price) {
            if(price === '<100k') return 'bg-green-100 text-green-700';
            if(price === '100-250k') return 'bg-blue-100 text-blue-700';
            return 'bg-purple-100 text-purple-700';
        }

        function renderList() {
            const listEl = document.getElementById('places-list');
            const filterPrice = document.getElementById('filter-price').value;
            
            listEl.innerHTML = '';
            
            const filtered = places.filter(p => filterPrice === 'all' || p.price === filterPrice);
            
            if(filtered.length === 0) {
                listEl.innerHTML = '<p class="text-center text-gray-500 text-sm mt-5">Chưa có quán nào trong mục này. Bấm dấu + để thêm nhé!</p>';
                return;
            }

            filtered.forEach(p => {
                listEl.innerHTML += `
                    <div class="bg-white rounded-xl p-4 shadow-sm flex items-center gap-4 relative break-words">
                        <div class="text-4xl shrink-0">${p.emoji}</div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-lg leading-tight mb-1 truncate whitespace-normal break-words">${p.name}</h3>
                            <div class="flex flex-wrap items-center gap-2 text-xs font-bold mt-1">
                                <span class="bg-gray-100 text-gray-600 px-2 py-1 rounded">📍 ${p.district}</span>
                                <span class="${getPriceColor(p.price)} px-2 py-1 rounded">${p.price}</span>
                            </div>
                        </div>
                        <div class="flex flex-col gap-2 shrink-0">
                            <a href="${p.map}" target="_blank" rel="noopener noreferrer" class="bg-blue-50 text-blue-500 p-2 rounded-lg text-center shadow-sm active:scale-95">
                                🗺️
                            </a>
                            <button onclick="deletePlace('${p.id}')" class="bg-red-50 text-red-500 p-2 rounded-lg shadow-sm active:scale-95">
                                🗑️
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function savePlace() {
            const name = document.getElementById('input-name').value;
            const district = document.getElementById('input-district').value;
            const price = document.getElementById('input-price').value;
            const map = document.getElementById('input-map').value;

            if(!name || !map) return alert('Vui lòng nhập đủ Tên quán và Link Google Maps!');

            places.unshift({
                id: Date.now().toString(),
                emoji: selectedEmoji,
                name, district, price, map
            });

            publishData(); // Đẩy lên mây ngay lập tức
            renderList();
            toggleModal(false);
            
            // Clear form
            document.getElementById('input-name').value = '';
            document.getElementById('input-district').value = '';
            document.getElementById('input-map').value = '';
        }

        function deletePlace(id) {
            if(confirm('Bạn có chắc muốn xoá quán này? Các máy khác cũng sẽ bị xoá theo!')) {
                places = places.filter(p => p.id !== id);
                publishData(); // Đẩy lệnh xoá lên mây (ghi đè mảng mới)
                renderList();
            }
        }

        function spinRandom() {
            if(places.length === 0) return alert('Hãy thêm vài quán vào danh sách trước nhé!');
            
            const filterPrice = document.getElementById('filter-price').value;
            const filtered = places.filter(p => filterPrice === 'all' || p.price === filterPrice);
            
            if(filtered.length === 0) return alert('Không có quán nào ở mức giá này để quay!');

            const resultEl = document.getElementById('random-result');
            let count = 0;
            const interval = setInterval(() => {
                const random = filtered[Math.floor(Math.random() * filtered.length)];
                resultEl.innerHTML = `<span class="text-yellow-200">${random.emoji}</span> ${random.name}`;
                count++;
                if(count > 8) {
                    clearInterval(interval);
                    const final = filtered[Math.floor(Math.random() * filtered.length)];
                    resultEl.innerHTML = `
                        <div class="flex flex-col items-center">
                            <span class="text-3xl mb-1">${final.emoji}</span>
                            <span class="text-white break-words w-full px-2">${final.name}</span>
                            <a href="${final.map}" target="_blank" class="mt-3 bg-white text-orange-600 text-sm py-2 px-4 rounded-full font-bold inline-block">
                                🗺️ Đi ngay
                            </a>
                        </div>
                    `;
                }
            }, 50);
        }

        function copyRoomLink() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert('Đã copy link! Hãy gửi link này cho bạn bè, ai mở link cũng sẽ thấy chung dữ liệu Real-time nhé!');
            }).catch(() => {
                alert('Copy lỗi! Bạn hãy copy đường link trên thanh địa chỉ của trình duyệt nhé.');
            });
        }
        
        // Khởi tạo trạng thái ban đầu để chọn icon đầu tiên
        document.querySelectorAll('#emoji-picker span')[0].classList.replace('border-transparent', 'border-orange-500');
    </script>
</body>
</html>
